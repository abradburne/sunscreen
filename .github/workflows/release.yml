# Push a tag like v0.1.0 to build and attach binaries to a GitHub release.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
  TAG: ${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$TAG" --generate-notes

  build:
    needs: release
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo test --release
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package and upload
        shell: bash
        run: |
          name="sunscreen-$TAG-${{ matrix.target }}"
          mkdir "$name"
          cp README.md "$name/"
          if [[ "${{ runner.os }}" == Windows ]]; then
            cp target/${{ matrix.target }}/release/sunscreen.exe "$name/"
            7z a "$name.zip" "$name" && file="$name.zip"
          else
            cp target/${{ matrix.target }}/release/sunscreen "$name/"
            tar czf "$name.tar.gz" "$name" && file="$name.tar.gz"
          fi
          gh release upload "$TAG" "$file"
